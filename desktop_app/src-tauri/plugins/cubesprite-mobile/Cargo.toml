[package]
name = "tauri-plugin-cubesprite-mobile"
version = "0.1.0"
description = "CubeSprite Android game and ONNX backend"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-cubesprite-mobile"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
