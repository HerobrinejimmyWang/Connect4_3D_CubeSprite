[package]
name = "cubesprite"
version = "0.1.0"
description = "CubeSprite 3D Connect Four desktop client"
authors = ["CubeSprite contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cubesprite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-cubesprite-mobile = { path = "plugins/cubesprite-mobile" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
